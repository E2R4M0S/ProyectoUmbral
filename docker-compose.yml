services:
  # ─── Keycloak ─────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    networks:
      - umbral-network
    depends_on:
      keycloak-db:
        condition: service_started

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - umbral-network

  # ─── Bases de datos por microservicio ────────────────────
  missions-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: missions
      POSTGRES_USER: missions
      POSTGRES_PASSWORD: missions123
    volumes:
      - missions-db-data:/var/lib/postgresql/data
    networks:
      - umbral-network

  sessions-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sessions
      POSTGRES_USER: sessions
      POSTGRES_PASSWORD: sessions123
    volumes:
      - sessions-db-data:/var/lib/postgresql/data
    networks:
      - umbral-network

  teams-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: teams
      POSTGRES_USER: teams
      POSTGRES_PASSWORD: teams123
    volumes:
      - teams-db-data:/var/lib/postgresql/data
    networks:
      - umbral-network

  trivia-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trivia
      POSTGRES_USER: trivia
      POSTGRES_PASSWORD: trivia123
    volumes:
      - trivia-db-data:/var/lib/postgresql/data
    networks:
      - umbral-network

  # ─── RabbitMQ ─────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - umbral-network

  # ─── API Gateway ──────────────────────────────────────────
  api-gateway:
    build:
      context: ./src/ApiGateway
    ports:
      - "5000:80"
    networks:
      - umbral-network
    depends_on:
      - keycloak

volumes:
  keycloak-db-data:
  missions-db-data:
  sessions-db-data:
  teams-db-data:
  trivia-db-data:

networks:
  umbral-network:
    driver: bridge
