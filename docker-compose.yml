services:
  # ─── Keycloak ─────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    networks:
      - umbral-network
    depends_on:
      keycloak-db:
        condition: service_started

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - umbral-network

  # ─── Bases de datos por microservicio ────────────────────
  missions-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: missions
      POSTGRES_USER: missions
      POSTGRES_PASSWORD: missions123
    volumes:
      - missions-db-data:/var/lib/postgresql/data
    networks:
      - umbral-network

  sessions-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sessions
      POSTGRES_USER: sessions
      POSTGRES_PASSWORD: sessions123
    volumes:
      - sessions-db-data:/var/lib/postgresql/data
    networks:
      - umbral-network

  teams-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: teams
      POSTGRES_USER: teams
      POSTGRES_PASSWORD: teams123
    volumes:
      - teams-db-data:/var/lib/postgresql/data
    networks:
      - umbral-network

  trivia-db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: trivia
      POSTGRES_USER: trivia
      POSTGRES_PASSWORD: trivia123
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trivia -d trivia"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - trivia-db-data:/var/lib/postgresql/data
    networks:
      - umbral-network

  # ─── RabbitMQ ─────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - umbral-network

  # ─── API Gateway ──────────────────────────────────────────
  api-gateway:
    build:
      context: ./src/ApiGateway
    ports:
      - "5000:80"
    networks:
      - umbral-network
    environment:
      ASPNETCORE_URLS: http://+:80
    depends_on:
      - keycloak

  # ─── Missions.Service ─────────────────────────────────────
  missions.service:
    build:
      context: ./src/Missions.Service
      dockerfile: Missions.Api/Dockerfile
    ports:
      - "5001:80"
    networks:
      - umbral-network
    environment:
      ASPNETCORE_URLS: http://+:80
    depends_on:
      missions-db:
        condition: service_started

  # ─── Sessions.Service ─────────────────────────────────────
  sessions.service:
    build:
      context: ./src/Sessions.Service
      dockerfile: Sessions.Api/Dockerfile
    ports:
      - "5002:80"
    networks:
      - umbral-network
    environment:
      ASPNETCORE_URLS: http://+:80
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__User: guest
      RabbitMq__Password: guest
      RabbitMq__Exchange: trivia.exchange
      Missions__Url: http://missions.service:80
    depends_on:
      sessions-db:
        condition: service_started
      rabbitmq:
        condition: service_started

  # ─── Teams.Service ────────────────────────────────────────
  teams.service:
    build:
      context: ./src/Teams.Service
      dockerfile: Teams.Api/Dockerfile
    ports:
      - "5003:80"
    networks:
      - umbral-network
    environment:
      ASPNETCORE_URLS: http://+:80
    depends_on:
      teams-db:
        condition: service_started

  # ─── Trivia.Service ───────────────────────────────────────
  trivia.service:
    build:
      context: ./src/Trivia.Service
      dockerfile: Trivia.Api/Dockerfile
    ports:
      - "5004:80"
    networks:
      - umbral-network
    environment:
      ASPNETCORE_URLS: http://+:80
      RABBITMQ_HOST: rabbitmq
      ENABLE_INTERNAL_TESTS: "true"
    depends_on:
      trivia-db:
        condition: service_healthy

  # ─── RealTimeHub (SignalR) ────────────────────────────────
  realtimehub:
    build:
      context: ./src/RealTimeHub
    ports:
      - "5005:80"
    extra_hosts:
      - "realtimehub:127.0.0.1"
    networks:
      - umbral-network
    environment:
      ASPNETCORE_URLS: http://+:80

  # ─── Frontend (Vite + React) ──────────────────────────────
  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://api-gateway:80
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway
    networks:
      - umbral-network

volumes:
  keycloak-db-data:
  missions-db-data:
  sessions-db-data:
  teams-db-data:
  trivia-db-data:

networks:
  umbral-network:
    driver: bridge
