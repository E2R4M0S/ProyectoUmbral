services:
  # ─── MailHog (SMTP mock server for dev) ────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    networks:
      - umbral-network

  # ─── Keycloak ─────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_HOSTNAME_URL: http://localhost:8080
      KC_HOSTNAME_ADMIN_URL: http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - ./themes:/opt/keycloak/themes:ro
    networks:
      - umbral-network
    depends_on:
      keycloak-db:
        condition: service_started

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - umbral-network

  # ─── Bases de datos por microservicio ────────────────────
  missions-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: missions
      POSTGRES_USER: missions
      POSTGRES_PASSWORD: missions123
    volumes:
      - missions-db-data:/var/lib/postgresql/data
    networks:
      - umbral-network

  sessions-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sessions
      POSTGRES_USER: sessions
      POSTGRES_PASSWORD: sessions123
    volumes:
      - sessions-db-data:/var/lib/postgresql/data
    networks:
      - umbral-network

  teams-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: teams
      POSTGRES_USER: teams
      POSTGRES_PASSWORD: teams123
    volumes:
      - teams-db-data:/var/lib/postgresql/data
    networks:
      - umbral-network

  trivia-db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: trivia
      POSTGRES_USER: trivia
      POSTGRES_PASSWORD: trivia123
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trivia -d trivia"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - trivia-db-data:/var/lib/postgresql/data
    networks:
      - umbral-network

  # ─── Keycloak setup (SMTP + Required Actions) ────────────
  keycloak-setup:
    image: alpine:latest
    depends_on:
      keycloak:
        condition: service_started
    networks:
      - umbral-network
    env_file:
      - .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl python3 py3-pip >/dev/null 2>&1
        echo "⏳ Esperando 25s a que Keycloak termine de arrancar..."
        sleep 25
        echo "🔑 Obteniendo token..."
        TOKEN=$(curl -s -X POST http://keycloak:8080/realms/master/protocol/openid-connect/token \
          -d "client_id=admin-cli&username=admin&password=admin123&grant_type=password" | \
          python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
        echo "📧 Configurando SMTP + Email Theme..."
        if [ -n "$SMTP_HOST" ]; then
          # Gmail SMTP desde .env
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT http://keycloak:8080/admin/realms/umbral \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"smtpServer\":{\"host\":\"$SMTP_HOST\",\"port\":\"$SMTP_PORT\",\"from\":\"$SMTP_FROM\",\"auth\":\"true\",\"user\":\"$SMTP_USER\",\"password\":\"$SMTP_PASSWORD\",\"ssl\":\"false\",\"starttls\":\"true\"},\"emailTheme\":\"umbral\"}")
          if [ "$HTTP_CODE" = "204" ]; then
            echo "   ✅ SMTP = $SMTP_HOST:$SMTP_PORT | Theme = umbral"
          else
            echo "   ⚠️ Config falló (HTTP $HTTP_CODE), reintentando..."
            curl -s -o /dev/null -X PUT http://keycloak:8080/admin/realms/umbral \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"smtpServer\":{\"host\":\"$SMTP_HOST\",\"port\":\"$SMTP_PORT\",\"from\":\"$SMTP_FROM\",\"auth\":\"true\",\"user\":\"$SMTP_USER\",\"password\":\"$SMTP_PASSWORD\",\"ssl\":\"false\",\"starttls\":\"true\"},\"emailTheme\":\"umbral\"}"
            echo "   ✅ Hecho (segundo intento)"
          fi
        else
          # Fallback a MailHog (desarrollo local)
          curl -s -o /dev/null -X PUT http://keycloak:8080/admin/realms/umbral \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"smtpServer":{"host":"mailhog","port":"1025","from":"noreply@umbral.local","auth":"false","ssl":"false","starttls":"false"},"emailTheme":"umbral"}'
          echo "   ✅ SMTP = mailhog:1025 | Theme = umbral"
        fi
        echo "🔧 Configurando VERIFY_EMAIL como default..."
        curl -s -o /dev/null -X PUT http://keycloak:8080/admin/realms/umbral/authentication/required-actions/VERIFY_EMAIL \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"alias":"VERIFY_EMAIL","name":"Verify Email","providerId":"VERIFY_EMAIL","enabled":true,"defaultAction":true,"priority":50,"config":{}}'
        echo "   ✅ VERIFY_EMAIL = enabled + defaultAction"
        echo "🔧 Asegurando UPDATE_PASSWORD habilitado..."
        curl -s -o /dev/null -X PUT http://keycloak:8080/admin/realms/umbral/authentication/required-actions/UPDATE_PASSWORD \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"alias":"UPDATE_PASSWORD","name":"Update Password","providerId":"UPDATE_PASSWORD","enabled":true,"defaultAction":false,"priority":40,"config":{}}'
        echo "   ✅ UPDATE_PASSWORD = enabled"
        echo "========================================="
        echo "🎉 Keycloak setup completado con éxito"
        echo "========================================="

  # ─── RabbitMQ ─────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - umbral-network

  # ─── API Gateway ──────────────────────────────────────────
  api-gateway:
    build:
      context: ./src/ApiGateway
    ports:
      - "5000:80"
    networks:
      - umbral-network
    environment:
      ASPNETCORE_URLS: http://+:80
    depends_on:
      - keycloak

  # ─── Missions.Service ─────────────────────────────────────
  missions.service:
    build:
      context: ./src/Missions.Service
      dockerfile: Missions.Api/Dockerfile
    ports:
      - "5001:80"
    networks:
      - umbral-network
    environment:
      ASPNETCORE_URLS: http://+:80
    depends_on:
      missions-db:
        condition: service_started

  # ─── Sessions.Service ─────────────────────────────────────
  sessions.service:
    build:
      context: ./src/Sessions.Service
      dockerfile: Sessions.Api/Dockerfile
    ports:
      - "5002:80"
    networks:
      - umbral-network
    environment:
      ASPNETCORE_URLS: http://+:80
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__User: guest
      RabbitMq__Password: guest
      RabbitMq__Exchange: trivia.exchange
      Missions__Url: http://missions.service:80
    depends_on:
      sessions-db:
        condition: service_started
      rabbitmq:
        condition: service_started

  # ─── Teams.Service ────────────────────────────────────────
  teams.service:
    build:
      context: ./src/Teams.Service
      dockerfile: Teams.Api/Dockerfile
    ports:
      - "5003:80"
    networks:
      - umbral-network
    environment:
      ASPNETCORE_URLS: http://+:80
    depends_on:
      teams-db:
        condition: service_started

  # ─── Trivia.Service ───────────────────────────────────────
  trivia.service:
    build:
      context: ./src/Trivia.Service
      dockerfile: Trivia.Api/Dockerfile
    ports:
      - "5004:80"
    networks:
      - umbral-network
    environment:
      ASPNETCORE_URLS: http://+:80
      RABBITMQ_HOST: rabbitmq
      ENABLE_INTERNAL_TESTS: "true"
    depends_on:
      trivia-db:
        condition: service_healthy

  # ─── RealTimeHub (SignalR) ────────────────────────────────
  realtimehub:
    build:
      context: ./src/RealTimeHub
    ports:
      - "5005:80"
    extra_hosts:
      - "realtimehub:127.0.0.1"
    networks:
      - umbral-network
    environment:
      ASPNETCORE_URLS: http://+:80

  # ─── Frontend (Vite + React) ──────────────────────────────
  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://api-gateway:80
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway
    networks:
      - umbral-network

volumes:
  keycloak-db-data:
  missions-db-data:
  sessions-db-data:
  teams-db-data:
  trivia-db-data:

networks:
  umbral-network:
    driver: bridge
