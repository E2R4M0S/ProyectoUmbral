name: CI — Build & Test

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"

jobs:
  backend-missions:
    name: Missions.Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/Missions.Service/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - run: dotnet restore src/Missions.Service/Missions.Service.slnx
      - run: dotnet build src/Missions.Service/Missions.Service.slnx --no-restore -c Release
      - run: dotnet test src/Missions.Service/Missions.Service.slnx --no-build -c Release --verbosity normal

  backend-sessions:
    name: Sessions.Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/Sessions.Service/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - run: dotnet restore src/Sessions.Service/Sessions.Service.slnx
      - run: dotnet build src/Sessions.Service/Sessions.Service.slnx --no-restore -c Release
      - run: dotnet test src/Sessions.Service/Sessions.Service.slnx --no-build -c Release --verbosity normal

  backend-trivia:
    name: Trivia.Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/Trivia.Service/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - run: dotnet restore src/Trivia.Service/Trivia.Service.slnx
      - run: dotnet build src/Trivia.Service/Trivia.Service.slnx --no-restore -c Release
      - run: dotnet test src/Trivia.Service/Trivia.Service.slnx --no-build -c Release --verbosity normal

  backend-gateway:
    name: ApiGateway + RealTimeHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/ApiGateway/**/*.csproj', 'src/ApiGateway.Tests/**/*.csproj', 'src/RealTimeHub/**/*.csproj', 'src/RealTimeHub.Tests/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - run: dotnet restore src/ApiGateway/ApiGateway.csproj
      - run: dotnet restore src/ApiGateway.Tests/ApiGateway.Tests.csproj
      - run: dotnet build src/ApiGateway/ApiGateway.csproj --no-restore -c Release
      - run: dotnet build src/ApiGateway.Tests/ApiGateway.Tests.csproj --no-restore -c Release
      - run: dotnet test src/ApiGateway.Tests/ApiGateway.Tests.csproj --no-build -c Release --verbosity normal
      - run: dotnet restore src/RealTimeHub/RealTimeHub.csproj
      - run: dotnet restore src/RealTimeHub.Tests/RealTimeHub.Tests.csproj
      - run: dotnet build src/RealTimeHub/RealTimeHub.csproj --no-restore -c Release
      - run: dotnet build src/RealTimeHub.Tests/RealTimeHub.Tests.csproj --no-restore -c Release
      - run: dotnet test src/RealTimeHub.Tests/RealTimeHub.Tests.csproj --no-build -c Release --verbosity normal

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  # E2E solo corre en push a develop/main (no en cada PR) porque requiere
  # levantar todo el stack con Docker Compose (Keycloak tarda ~20s en arrancar).
  e2e:
    name: E2E (Playwright)
    if: github.event_name == 'push'
    needs: [backend-missions, backend-sessions, backend-trivia, backend-gateway, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start full stack (Docker Compose)
        run: docker compose up -d --build

      - name: Wait for API Gateway
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:5000/health > /dev/null; then
              echo "API Gateway up"; exit 0
            fi
            echo "Waiting for API Gateway... ($i)"; sleep 5
          done
          echo "API Gateway never became healthy"; docker compose logs; exit 1

      - name: Wait for Frontend
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:5173 > /dev/null; then
              echo "Frontend up"; exit 0
            fi
            echo "Waiting for Frontend... ($i)"; sleep 5
          done
          echo "Frontend never became healthy"; docker compose logs frontend; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci
        working-directory: tests/e2e

      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - run: npx playwright test
        working-directory: tests/e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

      - name: Docker Compose logs (on failure)
        if: failure()
        run: docker compose logs --tail=300

      - name: Tear down stack
        if: always()
        run: docker compose down -v
